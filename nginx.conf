server {
    listen 80;
    listen [::]:80;
    server_name localhost smarthealthcare.dpdns.org;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # Health check endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Prometheus metrics forwarded to internal exporter
    location = /metrics {
        access_log off;
        proxy_pass http://127.0.0.1:9113/metrics;
    }

    # Spring Boot Actuator endpoints forwarded to internal exporter
    location ^~ /actuator {
        access_log off;
        proxy_pass http://127.0.0.1:9113;
        proxy_set_header Host $host;
    }

    # =========================================================================
    # CORE APPLICATION API & AUTH ROUTING
    # =========================================================================

    # API Gateway routing (clears external Origin on server-side proxy pass to prevent CORS 403 on custom domains)
    location ^~ /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    # OAuth2 social authorization routes direct to auth-service
    location ^~ /oauth2/authorization/ {
        proxy_pass http://auth-service:8081/oauth2/authorization/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    # OAuth2 social callback routes direct to auth-service
    location ^~ /login/oauth2/code/ {
        proxy_pass http://auth-service:8081/login/oauth2/code/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location ^~ /oauth2/ {
        proxy_pass http://api-gateway:8080/oauth2/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /login/ {
        proxy_pass http://api-gateway:8080/login/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Direct auth routing
    location ^~ /auth/ {
        proxy_pass http://auth-service:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin "";
    }

    location ^~ /dev/ {
        proxy_pass http://api-gateway:8080/dev//;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /logout {
        proxy_pass http://api-gateway:8080/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # SPRING BOOT ADMIN SERVER
    # =========================================================================
    location = /admin-server {
        return 301 /admin-server/;
    }

    location ^~ /admin-server/ {
        proxy_pass http://admin-server:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /admin-server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # EUREKA SERVICE DISCOVERY SERVER & DASHBOARD
    # =========================================================================
    location = /eureka {
        return 301 /eureka/;
    }

    # Eureka dashboard HTML (root at /)
    location = /eureka/ {
        proxy_pass http://discovery-server:8761/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Eureka static assets (eureka/css, eureka/js, eureka/fonts) & REST APIs (eureka/apps)
    location ^~ /eureka/ {
        proxy_pass http://discovery-server:8761/eureka/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /eureka-dashboard/ {
        proxy_pass http://discovery-server:8761/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # MAILPIT WEB UI & API (WebSockets enabled)
    # =========================================================================
    location = /mailpit {
        return 301 /mailpit/;
    }

    location ^~ /mailpit/ {
        proxy_pass http://mailpit:8025/mailpit/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # GRAFANA DASHBOARD (WebSockets enabled)
    # =========================================================================
    location = /grafana {
        return 301 /grafana/;
    }

    location ^~ /grafana/ {
        proxy_pass http://host.docker.internal:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =========================================================================
    # PROMETHEUS DASHBOARD
    # =========================================================================
    location = /prometheus {
        return 301 /prometheus/;
    }

    location ^~ /prometheus/ {
        proxy_pass http://host.docker.internal:9091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================================================================
    # UNIFIED SWAGGER UI & OPENAPI HUB (ALL MICROSERVICES)
    # =========================================================================
    # Serve swagger.html directly on all common swagger & doc routes without 301 redirects
    location = /swagger {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /swagger/ {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /swagger-ui {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /swagger-ui/ {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /swagger-ui.html {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /docs {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /docs/ {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /api-docs {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /api-docs/ {
        try_files /swagger.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /openapi.json {
        try_files /openapi.json =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    # Auth Service Swagger UI & Docs (standalone)
    location = /swagger/auth {
        return 302 /swagger/auth/;
    }
    location = /swagger/auth/ {
        return 302 /swagger/auth/swagger-ui/index.html;
    }
    location ^~ /swagger/auth/ {
        proxy_pass http://auth-service:8081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /swagger/auth;

        sub_filter_types application/javascript text/javascript application/json;
        sub_filter '<body>' '<body><div style="background:#0f172a;color:#f8fafc;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-family:sans-serif;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);position:sticky;top:0;z-index:9999;"><span>ℹ️ Viewing <b>Auth Service</b> standalone docs (3 endpoints).</span><a href="/docs/" style="color:#38bdf8;font-weight:700;text-decoration:none;background:#1e293b;padding:6px 14px;border-radius:6px;border:1px solid #38bdf8;">👉 Switch to Unified API Hub (All 20 Endpoints)</a></div>';
        sub_filter '"/v3/api-docs' '"/swagger/auth/v3/api-docs';
        sub_filter_once off;
    }

    # User Profile Service Swagger UI & Docs (standalone)
    location = /swagger/profile {
        return 302 /swagger/profile/;
    }
    location = /swagger/profile/ {
        return 302 /swagger/profile/swagger-ui/index.html;
    }
    location ^~ /swagger/profile/ {
        proxy_pass http://user-profile-service:8082/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /swagger/profile;

        sub_filter_types application/javascript text/javascript application/json;
        sub_filter '<body>' '<body><div style="background:#0f172a;color:#f8fafc;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-family:sans-serif;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);position:sticky;top:0;z-index:9999;"><span>ℹ️ Viewing <b>User Profile Service</b> standalone docs (3 endpoints).</span><a href="/docs/" style="color:#38bdf8;font-weight:700;text-decoration:none;background:#1e293b;padding:6px 14px;border-radius:6px;border:1px solid #38bdf8;">👉 Switch to Unified API Hub (All 20 Endpoints)</a></div>';
        sub_filter '"/v3/api-docs' '"/swagger/profile/v3/api-docs';
        sub_filter_once off;
    }

    # Health Data Service Swagger UI & Docs (standalone)
    location = /swagger/health {
        return 302 /swagger/health/;
    }
    location = /swagger/health/ {
        return 302 /swagger/health/swagger-ui/index.html;
    }
    location ^~ /swagger/health/ {
        proxy_pass http://health-data-service:8083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /swagger/health;

        sub_filter_types application/javascript text/javascript application/json;
        sub_filter '<body>' '<body><div style="background:#0f172a;color:#f8fafc;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-family:sans-serif;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);position:sticky;top:0;z-index:9999;"><span>ℹ️ Viewing <b>Health Data Service</b> standalone docs (6 endpoints).</span><a href="/docs/" style="color:#38bdf8;font-weight:700;text-decoration:none;background:#1e293b;padding:6px 14px;border-radius:6px;border:1px solid #38bdf8;">👉 Switch to Unified API Hub (All 20 Endpoints)</a></div>';
        sub_filter '"/v3/api-docs' '"/swagger/health/v3/api-docs';
        sub_filter_once off;
    }

    # Prediction Service Swagger UI & Docs (standalone)
    location = /swagger/prediction {
        return 302 /swagger/prediction/;
    }
    location = /swagger/prediction/ {
        return 302 /swagger/prediction/swagger-ui/index.html;
    }
    location ^~ /swagger/prediction/ {
        proxy_pass http://prediction-service:8085/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /swagger/prediction;

        sub_filter_types application/javascript text/javascript application/json;
        sub_filter '<body>' '<body><div style="background:#0f172a;color:#f8fafc;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;font-family:sans-serif;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.3);position:sticky;top:0;z-index:9999;"><span>ℹ️ Viewing <b>ML Prediction Service</b> standalone docs (6 endpoints).</span><a href="/docs/" style="color:#38bdf8;font-weight:700;text-decoration:none;background:#1e293b;padding:6px 14px;border-radius:6px;border:1px solid #38bdf8;">👉 Switch to Unified API Hub (All 20 Endpoints)</a></div>';
        sub_filter '"/v3/api-docs' '"/swagger/prediction/v3/api-docs';
        sub_filter_once off;
    }

    # Static Assets Cache
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SPA routing: fallback to index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
